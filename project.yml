name: Reloc
options:
  bundleIdPrefix: dev.reloc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  Reloc:
    type: application
    platform: iOS
    sources:
      - path: Reloc/Core
      - path: Reloc/UI
      - path: Reloc/Resources/Assets.xcassets
      - path: Reloc/Resources/MFi
        buildPhase: resources
        type: folder
    info:
      path: Reloc/Info.plist
      properties:
        CFBundleDisplayName: Reloc
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Reloc Pairing Record
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - dev.reloc.rppairing
              - dev.reloc.mobiledevicepairing
              - com.apple.property-list
              - public.xml
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: dev.reloc.rppairing
            UTTypeDescription: Remote Pairing File
            UTTypeConformsTo:
              - public.data
              - public.content
              - com.apple.property-list
            UTTypeTagSpecification:
              public.filename-extension:
                - rppairing
          - UTTypeIdentifier: dev.reloc.mobiledevicepairing
            UTTypeDescription: Mobile Device Pairing File
            UTTypeConformsTo:
              - public.data
              - public.content
              - com.apple.property-list
            UTTypeTagSpecification:
              public.filename-extension:
                - mobiledevicepairing
                - mobilepair
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Reloc 通过本地网络发现这台设备并完成配对，回环由你的外部代理提供。
        NSBonjourServices:
          - _remotepairing-pairable-host._tcp
          - _remotepairing._tcp
        NSLocationWhenInUseUsageDescription: 定位注入期间用于保持 Reloc 在后台运行并触发系统定位服务订阅。
        NSLocationAlwaysAndWhenInUseUsageDescription: 在定位工作階段中，允許 Reloc 切到背景後繼續接收系統定位更新。
        BGTaskSchedulerPermittedIdentifiers:
          - dev.reloc.ios.session-refresh
        UIBackgroundModes:
          - location
          - audio
          - fetch
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reloc.ios
        SWIFT_OBJC_BRIDGING_HEADER: Reloc/Core/ObjC/Reloc-Bridging-Header.h
        INFOPLIST_FILE: Reloc/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - framework: Vendor/RelocDeviceBridge.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
